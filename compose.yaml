version: "3.8"

services:
  mongo:
    image: mongo:latest
    container_name: pumai-db
    volumes:
      - mongo-data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: always

  mongoinit:
    image: mongo:latest
    depends_on:
      - mongo
    entrypoint: ["bash", "-c"]
    command: >
      "
      echo 'Waiting for MongoDB to be ready...' &&
      until mongo --host mongo --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1; do
        sleep 1;
      done &&
      echo 'Mongo is up. Initiating replica set...' &&
      mongo --host mongo --eval '
        rs.initiate({
          _id: \"rs0\",
          members: [{ _id: 0, host: \"mongo:27017\" }]
        });
      '
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pumai-app 
    depends_on:
      - mongoinit 
      - chroma 
      - mongo
    environment:
      - NODE_ENV=production
    volumes:
      - ./server/.env.prod:/app/server/.env.prod
    ports:
      - "3000:3000"
    restart: always
    command: ["sh", "-c", "sleep 5 && npm run start"]

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: pumai-chroma
    depends_on:
      - mongo
    environment:
      - CHROMA_DB_IMPL=mongodb
      - CHROMA_MONGODB_URI=mongodb://mongo:27017/chromadb
    volumes:
      - chroma-data:/data 
      - ./chroma/config.yaml:/app/config.yaml 
    restart: always

volumes:
  mongo-data:
  chroma-data: 
